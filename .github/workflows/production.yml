name: Production

# Run by hand (Actions → Production → Run workflow, or the API), never on a
# push. It exists so a release can be migrated and deployed without a
# production credential ever touching a laptop's shell history, a chat, or an
# assistant's context (§2.3): the credentials live in this repository's
# Actions secrets, are masked in the log, and are used only by
# tools/production.sh, which never echoes one.
#
#   status   — which migrations the production database has applied
#   migrate  — apply every pending migration from the chosen ref, in order,
#              each in its own transaction, then status
#   deploy   — build and deploy the chosen ref to Vercel production
#   release  — migrate, THEN deploy, then wait for /api/health?strict=1 to
#              report the ref's migration — DEPLOYING.md, "migrate FIRST"
#   worker   — deploy apps/agent to Fly.io (fly.toml), one machine that never
#              stops, and point the web app at it (AGENT_URL and a shared
#              AGENT_INTERNAL_TOKEN, set on Vercel and redeployed)
#
# Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN             deploy and release. Also how the database URL is
#                            found: from the Vercel project's own production
#                            DATABASE_URL, with Neon's `-pooler` taken off
#   PRODUCTION_DATABASE_URL  optional: Neon's DIRECT string. Needed only when
#                            Vercel's DATABASE_URL is marked Sensitive, which
#                            `vercel pull` never returns
#   VERCEL_ORG_ID, VERCEL_PROJECT_ID, VERCEL_TEAM   optional; without them
#                            the project `agency-os` is found under every
#                            scope the token reaches
#   FLY_API_TOKEN            worker: a Fly ORG token. The worker also needs
#                            PRODUCTION_DATABASE_URL (Neon's DIRECT string),
#                            and takes any of ANTHROPIC_API_KEY, SECRETS_KEY,
#                            SMTP_*, MAIL_FROM, IMAP_*, SLACK_WEBHOOK_URL,
#                            UNSUBSCRIBE_SECRET, DOVESOFT_API_KEY and
#                            DOVESOFT_ENTITY_ID that are set as secrets

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'status, migrate, deploy, release or worker'
        required: true
        default: status
        type: choice
        options: [status, migrate, deploy, release, worker]
      confirm:
        description: 'For anything but status, type the action again'
        required: false
        default: ''

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  production:
    name: production ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # So a secret saved under Settings → Environments → production is seen
    # as well as a repository secret.
    environment: production
    steps:
      # Where each credential is visible, as true/false only: a value saved
      # as a Variable instead of a Secret would be printed in the step's env
      # block, so it is detected here and never read.
      - name: Which credentials this run can see
        env:
          TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN != '' }}
          TOKEN_VARIABLE: ${{ vars.VERCEL_TOKEN != '' }}
          DB_SECRET: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
          DB_VARIABLE: ${{ vars.PRODUCTION_DATABASE_URL != '' }}
          FLY_SECRET: ${{ secrets.FLY_API_TOKEN != '' }}
          FLY_VARIABLE: ${{ vars.FLY_API_TOKEN != '' }}
        run: |
          echo "VERCEL_TOKEN            secret: $TOKEN_SECRET  variable: $TOKEN_VARIABLE"
          echo "PRODUCTION_DATABASE_URL secret: $DB_SECRET  variable: $DB_VARIABLE"
          echo "FLY_API_TOKEN           secret: $FLY_SECRET  variable: $FLY_VARIABLE"
          if [ "$TOKEN_VARIABLE" = true ] || [ "$DB_VARIABLE" = true ] || [ "$FLY_VARIABLE" = true ]; then
            echo "::error::A credential is saved as a Variable, which is shown in plain text. Delete it there and add it under Secrets instead."
            exit 1
          fi
      - name: Refuse an unconfirmed change
        if: inputs.action != 'status' && inputs.confirm != inputs.action
        env:
          ACTION: ${{ inputs.action }}
        run: |
          echo "::error::Type '$ACTION' in the confirm field to run it against production."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # A third-party action, in the job that holds every production
      # credential: pinned to a full commit (the one `master` and `v1` named
      # when it was pinned), never a branch or a tag, which a push to that
      # repository could move — and flyctl itself pinned by version.
      - name: Install flyctl
        if: inputs.action == 'worker'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
        with:
          version: 0.4.111
      # Two steps, so a credential reaches only the action that uses it:
      # status, migrate, deploy and release see the database and Vercel
      # only; the worker's own secrets — Fly, the model, the mailboxes,
      # Slack, DoveSoft — reach the worker step alone.
      - name: ${{ inputs.action }}
        if: inputs.action != 'worker'
        env:
          ACTION: ${{ inputs.action }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
        run: tools/production.sh "$ACTION"
      - name: worker
        if: inputs.action == 'worker'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_SECURE: ${{ secrets.IMAP_SECURE }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          DOVESOFT_API_KEY: ${{ secrets.DOVESOFT_API_KEY }}
          DOVESOFT_ENTITY_ID: ${{ secrets.DOVESOFT_ENTITY_ID }}
        run: tools/production.sh worker
