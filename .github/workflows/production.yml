name: Production

# Run by hand (Actions → Production → Run workflow, or the API), never on a
# push. It exists so a release can be migrated and deployed without a
# production credential ever touching a laptop's shell history, a chat, or an
# assistant's context (§2.3): the credentials live in this repository's
# Actions secrets, are masked in the log, and are used only by
# tools/production.sh, which never echoes one.
#
#   status   — which migrations the production database has applied
#   migrate  — apply every pending migration from the chosen ref, in order,
#              each in its own transaction, then status
#   deploy   — build and deploy the chosen ref to Vercel production
#   release  — migrate, THEN deploy, then wait for /api/health?strict=1 to
#              report the ref's migration — DEPLOYING.md, "migrate FIRST"
#   worker   — deploy apps/agent to Fly.io (fly.toml), one machine that never
#              stops, and point the web app at it (AGENT_URL and a shared
#              AGENT_INTERNAL_TOKEN, set on Vercel and redeployed) — in two
#              jobs, `worker` and `worker-web`, below
#
# Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN             deploy, release and worker. Also how the database
#                            URL is found for status, migrate and release:
#                            from the Vercel project's own production
#                            DATABASE_URL, with Neon's `-pooler` taken off
#   PRODUCTION_DATABASE_URL  Neon's DIRECT string. Optional for those three
#                            — needed only when Vercel's DATABASE_URL is
#                            marked Sensitive, which `vercel pull` never
#                            returns — and REQUIRED for worker, whose job
#                            never runs the Vercel CLI
#   VERCEL_ORG_ID, VERCEL_PROJECT_ID, VERCEL_TEAM   optional; without them
#                            the project `agency-os` is found under every
#                            scope the token reaches
#   FLY_API_TOKEN            worker: a Fly ORG token. The worker also takes
#                            any of ANTHROPIC_API_KEY, SECRETS_KEY, SMTP_*,
#                            MAIL_FROM, IMAP_*, SLACK_WEBHOOK_URL,
#                            UNSUBSCRIBE_SECRET, DOVESOFT_API_KEY and
#                            DOVESOFT_ENTITY_ID that are set as secrets

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'status, migrate, deploy, release or worker'
        required: true
        default: status
        type: choice
        options: [status, migrate, deploy, release, worker]
      confirm:
        description: 'For anything but status, type the action again'
        required: false
        default: ''

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # status, migrate, deploy and release: the database and Vercel only.
  production:
    name: production ${{ inputs.action }}
    if: inputs.action != 'worker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # So a secret saved under Settings → Environments → production is seen
    # as well as a repository secret.
    environment: production
    steps:
      # Where each credential is visible, as true/false only: a value saved
      # as a Variable instead of a Secret would be printed in the step's env
      # block, so it is detected here and never read. Only the two this job
      # uses: naming a secret anywhere in a job, even in a `!= ''`, sends its
      # value to that job's runner, and this job runs the Vercel CLI.
      - name: Which credentials this run can see
        env:
          TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN != '' }}
          TOKEN_VARIABLE: ${{ vars.VERCEL_TOKEN != '' }}
          DB_SECRET: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
          DB_VARIABLE: ${{ vars.PRODUCTION_DATABASE_URL != '' }}
        run: |
          echo "VERCEL_TOKEN            secret: $TOKEN_SECRET  variable: $TOKEN_VARIABLE"
          echo "PRODUCTION_DATABASE_URL secret: $DB_SECRET  variable: $DB_VARIABLE"
          if [ "$TOKEN_VARIABLE" = true ] || [ "$DB_VARIABLE" = true ]; then
            echo "::error::A credential is saved as a Variable, which is shown in plain text. Delete it there and add it under Secrets instead."
            exit 1
          fi
      - name: Refuse an unconfirmed change
        if: inputs.action != 'status' && inputs.confirm != inputs.action
        env:
          ACTION: ${{ inputs.action }}
        run: |
          echo "::error::Type '$ACTION' in the confirm field to run it against production."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
        run: tools/production.sh "$ACTION"

  # `worker`, in two JOBS — two fresh VMs — because a step is not a
  # credential boundary (review round 8, [5]). tools/production.sh hands the
  # worker's secrets to no program but flyctl, but un-exporting a variable
  # only changes what a child inherits: every process the runner user starts
  # can read /proc/<pid>/environ of the shells above it. The Vercel CLI,
  # which npx installs at run time with no lockfile, and whose `build` runs
  # the whole web build, must therefore never run on a VM that holds one.
  #
  # Job 1: Fly. The worker's own secrets — Fly, the model, the mailboxes,
  # Slack, DoveSoft — reach this job's script step alone, and that script
  # (its WORKER_ONLY, which must list every one of them below) never runs
  # the Vercel CLI: it reads the database URL from PRODUCTION_DATABASE_URL,
  # and sets the web app's variables through tools/vercel-env.mjs, our own,
  # from the lockfile.
  worker:
    name: worker (Fly)
    if: inputs.action == 'worker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # `true` when the web app must be redeployed. Never a secret, and never
    # the wiring marker: GitHub drops a job output that contains any secret
    # value of this job as a substring — SMTP_SECURE or IMAP_SECURE may well
    # be `true` or `false`, and FLY_ORG may be part of the Fly app's name —
    # so the marker crosses on Vercel instead (tools/production.sh,
    # AGENT_INTERNAL_TOKEN_PENDING), and `worker-web` is skipped only on a
    # `false` that arrived.
    outputs:
      redeploy: ${{ steps.worker.outputs.redeploy }}
    steps:
      # Where each credential is visible, as true/false only: a value saved
      # as a Variable instead of a Secret would be printed in the step's env
      # block, so it is detected here and never read.
      - name: Which credentials this run can see
        env:
          TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN != '' }}
          TOKEN_VARIABLE: ${{ vars.VERCEL_TOKEN != '' }}
          DB_SECRET: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
          DB_VARIABLE: ${{ vars.PRODUCTION_DATABASE_URL != '' }}
          FLY_SECRET: ${{ secrets.FLY_API_TOKEN != '' }}
          FLY_VARIABLE: ${{ vars.FLY_API_TOKEN != '' }}
        run: |
          echo "VERCEL_TOKEN            secret: $TOKEN_SECRET  variable: $TOKEN_VARIABLE"
          echo "PRODUCTION_DATABASE_URL secret: $DB_SECRET  variable: $DB_VARIABLE"
          echo "FLY_API_TOKEN           secret: $FLY_SECRET  variable: $FLY_VARIABLE"
          if [ "$TOKEN_VARIABLE" = true ] || [ "$DB_VARIABLE" = true ] || [ "$FLY_VARIABLE" = true ]; then
            echo "::error::A credential is saved as a Variable, which is shown in plain text. Delete it there and add it under Secrets instead."
            exit 1
          fi
      - name: Refuse an unconfirmed change
        if: inputs.action != 'status' && inputs.confirm != inputs.action
        env:
          ACTION: ${{ inputs.action }}
        run: |
          echo "::error::Type '$ACTION' in the confirm field to run it against production."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # A third-party action, in the job that holds every worker secret:
      # pinned to a full commit (the one `master` and `v1` named when it was
      # pinned), never a branch or a tag, which a push to that repository
      # could move — and flyctl itself pinned by version.
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
        with:
          version: 0.4.111
      - name: worker
        id: worker
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_SECURE: ${{ secrets.IMAP_SECURE }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          DOVESOFT_API_KEY: ${{ secrets.DOVESOFT_API_KEY }}
          DOVESOFT_ENTITY_ID: ${{ secrets.DOVESOFT_ENTITY_ID }}
        run: tools/production.sh worker

  # Job 2: the web app, on a VM that never held a worker secret. VERCEL_*
  # alone — not even the database URL — for the Vercel CLI's pull, build and
  # prebuilt deploy; then /api/health?strict=1; then, LAST, the wiring
  # marker; then the worker seen live from the web app.
  worker-web:
    name: worker (web redeploy)
    needs: worker
    # Fail-open: a `true` GitHub dropped (above) still redeploys; only a
    # `false` that arrived skips this job, and a `false` that was dropped
    # runs it to find nothing of this run waiting.
    if: needs.worker.outputs.redeploy != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      # VERCEL_TOKEN only: naming any other secret here, even in a `!= ''`,
      # would send its value to this job's runner.
      - name: Which credentials this job can see
        env:
          TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN != '' }}
          TOKEN_VARIABLE: ${{ vars.VERCEL_TOKEN != '' }}
        run: |
          echo "VERCEL_TOKEN            secret: $TOKEN_SECRET  variable: $TOKEN_VARIABLE"
          if [ "$TOKEN_VARIABLE" = true ]; then
            echo "::error::A credential is saved as a Variable, which is shown in plain text. Delete it there and add it under Secrets instead."
            exit 1
          fi
      - name: Refuse an unconfirmed change
        if: inputs.action != 'status' && inputs.confirm != inputs.action
        env:
          ACTION: ${{ inputs.action }}
        run: |
          echo "::error::Type '$ACTION' in the confirm field to run it against production."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: worker-web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
        run: tools/production.sh worker-web
