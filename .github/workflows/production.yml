name: Production

# Run by hand (Actions → Production → Run workflow, or the API), never on a
# push. It exists so a release can be migrated and deployed without a
# production credential ever touching a laptop's shell history, a chat, or an
# assistant's context (§2.3): the credentials live in this repository's
# Actions secrets, are masked in the log, and are used only by
# tools/production.sh, which never echoes one.
#
#   status   — which migrations the production database has applied
#   migrate  — apply every pending migration from the chosen ref, in order,
#              each in its own transaction, then status
#   deploy   — build and deploy the chosen ref to Vercel production
#   release  — migrate, THEN deploy, then wait for /api/health?strict=1 to
#              report the ref's migration — DEPLOYING.md, "migrate FIRST"
#
# Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN             deploy and release. Also how the database URL is
#                            found: from the Vercel project's own production
#                            DATABASE_URL, with Neon's `-pooler` taken off
#   PRODUCTION_DATABASE_URL  optional: Neon's DIRECT string. Needed only when
#                            Vercel's DATABASE_URL is marked Sensitive, which
#                            `vercel pull` never returns
#   VERCEL_ORG_ID, VERCEL_PROJECT_ID, VERCEL_TEAM   optional; without them
#                            the project `agency-os` is linked on the token's
#                            default team

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'status, migrate, deploy or release'
        required: true
        default: status
        type: choice
        options: [status, migrate, deploy, release]
      confirm:
        description: 'For anything but status, type the action again'
        required: false
        default: ''

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  production:
    name: production ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # So a secret saved under Settings → Environments → production is seen
    # as well as a repository secret.
    environment: production
    steps:
      # Where each credential is visible, as true/false only: a value saved
      # as a Variable instead of a Secret would be printed in the step's env
      # block, so it is detected here and never read.
      - name: Which credentials this run can see
        env:
          TOKEN_SECRET: ${{ secrets.VERCEL_TOKEN != '' }}
          TOKEN_VARIABLE: ${{ vars.VERCEL_TOKEN != '' }}
          DB_SECRET: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
          DB_VARIABLE: ${{ vars.PRODUCTION_DATABASE_URL != '' }}
        run: |
          echo "VERCEL_TOKEN            secret: $TOKEN_SECRET  variable: $TOKEN_VARIABLE"
          echo "PRODUCTION_DATABASE_URL secret: $DB_SECRET  variable: $DB_VARIABLE"
          if [ "$TOKEN_VARIABLE" = true ] || [ "$DB_VARIABLE" = true ]; then
            echo "::error::A credential is saved as a Variable, which is shown in plain text. Delete it there and add it under Secrets instead."
            exit 1
          fi
      - name: Refuse an unconfirmed change
        if: inputs.action != 'status' && inputs.confirm != inputs.action
        env:
          ACTION: ${{ inputs.action }}
        run: |
          echo "::error::Type '$ACTION' in the confirm field to run it against production."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
        run: tools/production.sh "$ACTION"
