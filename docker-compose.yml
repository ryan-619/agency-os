# Agency OS — the whole system on one host (PROMPT.md §3).
#
#   cp .env.example .env      # then set AUTH_SECRET
#   docker compose up --build
#   docker compose run --rm migrate     # apply migrations
#   docker compose run --rm seed        # create the org, owner and ICP
#
# Lead data stays on the agency's own hardware. Nothing here talks to a managed
# service.

name: agency-os

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agency}
      POSTGRES_DB: ${POSTGRES_DB:-agency}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for psql and for running the app on the host. Bound to
      # loopback so the database is not reachable from the network.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agency} -d ${POSTGRES_DB:-agency}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Development mail sink. Magic links land here instead of the internet.
  #
  # DEV ONLY. It accepts everything and relays nothing. In production, point
  # SMTP_* at the agency's warmed mailboxes and remove this service. It is in
  # the default stack rather than behind a profile so that a fresh
  # `docker compose up` gives a working login, which is what Phase 0 promises.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025' # web UI — read the magic link here
      - '127.0.0.1:1025:1025' # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-agency}:${POSTGRES_PASSWORD:-agency}@db:5432/${POSTGRES_DB:-agency}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      AUTH_SECRET: "${AUTH_SECRET:?required - generate one with openssl rand -base64 32}"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Empty against mailpit, which accepts anything. Required once SMTP_HOST
      # points at a real relay — without these the transport is built
      # unauthenticated and the relay answers 530 Authentication Required.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-Agency OS <agency-os@localhost>}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The agent worker. Without BOTH of these the chat panel reports "the
      # agent is not configured" and everything else keeps working — which is
      # the right failure, but it made `docker compose up` look like a stack
      # with no chat rather than a stack missing two variables.
      #
      # The port is the worker's API (AGENT_PORT + 1), not its health port.
      AGENT_URL: ${AGENT_URL:-http://agent:3002}
      AGENT_INTERNAL_TOKEN: "${AGENT_INTERNAL_TOKEN:?required - generate one with openssl rand -base64 32}"
      # Optional, all of them, and every feature behind one fails closed
      # without it. Not wired here because none is needed for the stack to
      # boot: set them in .env when the feature is configured.
      #   CRON_SECRET, RESCAN_BATCH_SIZE   the daily rescan (a Vercel cron;
      #                                    under compose the worker scans)
      #   SLACK_WEBHOOK_URL                notifications — the URL is the credential
      #   UNSUBSCRIBE_SECRET               one-click unsubscribe; same value as the agent's
      #   RESEND_WEBHOOK_SECRET, RESEND_API_KEY   replies through Resend's webhook
      #   INBOUND_WEBHOOK_SECRET           replies through a plain JSON webhook
      #   SECRETS_KEY                      to store connector credentials from the UI
    ports:
      - '3000:3000'

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-agency}:${POSTGRES_PASSWORD:-agency}@db:5432/${POSTGRES_DB:-agency}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
      AGENT_PORT: 3001
      # Loopback is the default and is right on a VPS where both processes
      # share a host. Here they do not: each service has its own network
      # namespace, so a worker bound to 127.0.0.1 is reachable from nothing
      # but itself and every call from `web` is refused. The API port below is
      # deliberately NOT published, so the docker network is the boundary.
      AGENT_BIND: 0.0.0.0
      # The web app proves it is the web app. The worker REFUSES TO BOOT
      # without it (32 chars minimum), so `docker compose up` died here with
      # nothing in the compose file setting it.
      AGENT_INTERNAL_TOKEN: "${AGENT_INTERNAL_TOKEN:?required - generate one with openssl rand -base64 32}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The Agent SDK reads this from the environment (§5). Without it the
      # worker still boots and still serves health; chat reports itself
      # disabled and the rest of the product is unaffected.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # §2.3 — third-party credentials are encrypted at rest with this key.
      # Optional until a connector is configured (Phase 3).
      SECRETS_KEY: ${SECRETS_KEY:-}
      # §6's skills volume. Skills are filesystem-only in the SDK, and loading
      # them means loading the project SETTING SOURCE — which is one of the
      # three documented ways the approval gate is skipped. The worker
      # therefore REFUSES to load skills from a directory containing anything
      # that could carry a permission rule (.claude/settings.json, agents/,
      # commands/, hooks/, mcp.json) and says which file stopped it.
      #
      # Mounted READ-ONLY below: a skill is instructions the model follows, so
      # a writable mount would let anything that reaches the worker rewrite
      # them for every later turn.
      AGENT_SKILLS_DIR: /app/skills
      # Outreach (§8.4). The worker sends and reads replies; the web app only
      # queues. Optional — unset means `outreach: disabled` on /readyz.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-Agency OS <agency-os@localhost>}"
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      OUTREACH_TICK_MS: ${OUTREACH_TICK_MS:-15000}
      OUTREACH_BATCH: ${OUTREACH_BATCH:-20}
      # §5.4's bounds on one turn, and §8.1's on a conversation.
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-30}
      AGENT_MAX_BUDGET_USD: ${AGENT_MAX_BUDGET_USD:-2}
      AGENT_SESSION_BUDGET_USD: ${AGENT_SESSION_BUDGET_USD:-20}
      # The turn timeout MUST exceed the approval TTL or the worker refuses to
      # boot: a turn killed while its own approval is still live means a
      # human's decision lands on a turn that no longer exists.
      APPROVAL_TTL_MINUTES: ${APPROVAL_TTL_MINUTES:-30}
      AGENT_TURN_TIMEOUT_MINUTES: ${AGENT_TURN_TIMEOUT_MINUTES:-35}
      # Bound the blast radius of a subagent fan-out (§7).
      CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: ${CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS:-3}
      CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: ${CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH:-2}
      # Optional. Without BOTH of the first two the worker adds no
      # List-Unsubscribe header and says so once at boot; the third pauses a
      # campaign whose bounce rate passes it.
      #   UNSUBSCRIBE_SECRET          same value as the web app's
      #   WEB_PUBLIC_URL              where /api/unsubscribe lives, as the worker sees it
      #   OUTREACH_BOUNCE_PAUSE_PCT   default 5
    volumes:
      # Put a skill at ./skills/.claude/skills/<name>/SKILL.md. The directory
      # may hold NOTHING else under .claude/ — see AGENT_SKILLS_DIR above.
      - ./skills:/app/skills:ro
    ports:
      # Health only. The API on 3002 is reachable from `web` over the compose
      # network and from nowhere else — publishing it would put an endpoint
      # that starts agent turns on the host interface.
      - '127.0.0.1:3001:3001'

  # The voice service (§8.5). Behind a PROFILE, so `docker compose up` does
  # NOT start it: §12 says not to switch Phase 6 on before A2P 10DLC
  # registration clears, and a service that answers the phone should not
  # start because somebody brought the stack up.
  #
  #   docker compose --profile voice up -d voice
  #
  # It needs a PUBLIC https origin (Twilio has to reach it, and the request
  # signature is computed over the URL Twilio used, not the one the socket
  # saw), so behind a reverse proxy set VOICE_PUBLIC_URL to the outside
  # address. With it unset every webhook is refused, which is the correct
  # failure: these endpoints can write a suppression.
  voice:
    build:
      context: .
      dockerfile: apps/voice/Dockerfile
    profiles: ['voice']
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-agency}:${POSTGRES_PASSWORD:-agency}@db:5432/${POSTGRES_DB:-agency}
      DATABASE_POOL_MAX: ${VOICE_POOL_MAX:-4}
      VOICE_PORT: 3003
      # Loopback is wrong under compose for the same reason it is wrong for
      # the agent worker: each service has its own network namespace.
      VOICE_BIND: 0.0.0.0
      VOICE_PUBLIC_URL: ${VOICE_PUBLIC_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      VOICE_ORG_ID: ${VOICE_ORG_ID:-}
      TASKROUTER_WORKFLOW_SID: ${TASKROUTER_WORKFLOW_SID:-}
      VOICE_HANDOFF_NUMBER: ${VOICE_HANDOFF_NUMBER:-}
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-en-US}
      VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-}
      VOICE_MAX_CALL_SECONDS: ${VOICE_MAX_CALL_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:3003:3003'

  # --- one-off tasks --------------------------------------------------------
  # Run with `docker compose run --rm migrate`. They exit when done, so they
  # carry `profiles` and never start as part of `docker compose up`.

  migrate:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    profiles: ['tasks']
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agency}:${POSTGRES_PASSWORD:-agency}@db:5432/${POSTGRES_DB:-agency}
    command: ['node', 'packages/db/dist/cli.js', 'up']

  seed:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    profiles: ['tasks']
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agency}:${POSTGRES_PASSWORD:-agency}@db:5432/${POSTGRES_DB:-agency}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-Agency}
      SEED_OWNER_EMAIL: "${SEED_OWNER_EMAIL:?required - it is the only account that can sign in}"
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Owner}
    command: ['node', 'packages/db/dist/seed-cli.js']

volumes:
  pgdata:
